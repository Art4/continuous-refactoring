name: Test Harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tier1:
    name: Tier 1 - Static Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml jsonschema==4.23.0
      - name: Run validator
        run: python scripts/validate_skills.py .

  tier4:
    name: Tier 4 - Parser tests and negative controls
    runs-on: ubuntu-latest
    needs: tier1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Tier 4 deterministic tests
        run: python3 -m unittest scripts.test_tooling_tree scripts.test_trigger_controls -v

name: Test Harness

on:
  pull_request:

jobs:
  tier1:
    name: Tier 1 - Static Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run validator
        run: python scripts/validate_skills.py

  tier2:
    name: Tier 2 - Artifact Contracts
    runs-on: ubuntu-latest
    needs: tier1
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t test-harness fixtures/harness/
      - name: Run Tier 2 tests
        run: |
          chmod +x fixtures/harness/run.sh
          ./fixtures/harness/run.sh tier2 php-project-with-candidates

  tier3:
    name: Tier 3 - Ground Truth
    runs-on: ubuntu-latest
    needs: tier1
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t test-harness fixtures/harness/
      # Baselines are gitignored (fixtures/baselines/, "generated, not
      # committed") — this cache is what makes tier3's regression gate
      # (ticket 27, Tier 5) mean something across runs instead of comparing
      # a freshly-generated baseline against itself every time.
      - name: Restore baseline cache
        uses: actions/cache@v4
        with:
          path: fixtures/baselines/
          key: test-harness-baseline-${{ github.ref }}
          restore-keys: |
            test-harness-baseline-refs/heads/main
      - name: Run Tier 3 tests
        run: |
          chmod +x fixtures/harness/run.sh
          ./fixtures/harness/run.sh tier3 php-project-with-candidates
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: fixtures/baselines/

  tier4:
    name: Tier 4 - Trigger/Discoverability (deterministic negative control)
    runs-on: ubuntu-latest
    needs: tier1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Only the "clean repo reports clean" negative control is
      # deterministic (scripts/test_trigger_controls.py); the other two
      # negative controls and explicit/implicit-invocation discoverability
      # are prose-level judgment calls exercised by `run.sh tier4
      # --opencode` locally, not in CI (no model credentials here — see
      # fixtures/README.md's "Tier 4" section).
      - name: Run Tier 4 deterministic tests
        run: python3 -m unittest scripts.test_trigger_controls -v

  roadmap:
    name: Roadmap — ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    needs: tier1
    strategy:
      fail-fast: false
      matrix:
        fixture: [php-empty, php-partial, php-p0-empty, php-p0-nonempty, php-psalm, php-clean, php-project-with-candidates]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run roadmap dry-run (no MR)
        run: |
          chmod +x fixtures/harness/run.sh
          ./fixtures/harness/run.sh roadmap ${{ matrix.fixture }}
